name: Build Naol Private APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build and Validate APK
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Check required files
    run: |
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f gradle.properties
      test -f app/build.gradle.kts
      test -f app/src/main/AndroidManifest.xml
      test -f app/src/main/java/com/naol/privateapp/MainActivity.kt
      test -f app/src/main/java/com/naol/privateapp/AlarmService.kt

  - name: Build debug APK
    run: gradle --no-daemon clean assembleDebug

  - name: Validate APK
    run: |
      test -s app/build/outputs/apk/debug/app-debug.apk
      ls -lh app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Naol-Private-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
